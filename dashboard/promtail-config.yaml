server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: honeypot_logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: honeypot
      __path__: /logs/cowrie/cowrie.json
  - targets:
      - localhost

#    IMPORTANT: if you're going to use mock-server logs, uncomment lines below, otherwise it will not work!
#    labels:
#      job: honeypot
#      __path__: /logs/honeypot.json.log
